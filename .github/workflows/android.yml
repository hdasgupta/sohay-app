name: Build Production Android APK

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Sohay APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================================================
      # 3. Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # =========================================================
      # 4. Install frontend dependencies
      # =========================================================
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      # =========================================================
      # 5. Configure Android SDK
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."

            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # =========================================================
      # 6. Accept Android licenses
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      # =========================================================
      # 7. Install Android SDK 34
      # =========================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # =========================================================
      # 8. Verify Android SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

          test -f \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"

          test -f \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

          echo "Android SDK 34 is ready."

      # =========================================================
      # 9. Build web application
      # =========================================================
      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      # =========================================================
      # 10. Capacitor sync
      #
      # IMPORTANT:
      # This generates:
      #
      # frontend/android/capacitor-cordova-android-plugins/
      # frontend/android/capacitor-cordova-android-plugins/
      #     cordova.variables.gradle
      #
      # which was missing in your failed build.
      # =========================================================
      - name: Sync Capacitor Android project
        working-directory: frontend
        run: |
          npx cap sync android

      # =========================================================
      # 11. Verify Capacitor generated files
      # =========================================================
      - name: Verify Capacitor Android files
        shell: bash
        run: |
          set -e

          FILE="frontend/android/capacitor-cordova-android-plugins/cordova.variables.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Capacitor did not generate:"
            echo "$FILE"

            echo
            echo "Contents of frontend/android:"
            find frontend/android \
              -maxdepth 3 \
              -type f \
              -print | sort

            exit 1
          fi

          echo "Capacitor generated files successfully."
          echo "$FILE"

      # =========================================================
      # 12. Check signing secrets
      # =========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All Android signing secrets are present."

      # =========================================================
      # 13. Decode keystore
      # =========================================================
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p frontend/android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > frontend/android/app/sohay-release.keystore

          test -s frontend/android/app/sohay-release.keystore

          echo "Release keystore created."

      # =========================================================
      # 14. Configure release signing
      # =========================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -e

          cat > frontend/android/signing.init.gradle <<'EOF'
          gradle.afterProject { project ->

              if (project.name == "app" &&
                  project.plugins.hasPlugin("com.android.application")) {

                  def android =
                      project.extensions.findByName("android")

                  if (android != null) {

                      def signingConfig =
                          android.signingConfigs.findByName("release")

                      if (signingConfig == null) {
                          signingConfig =
                              android.signingConfigs.create("release")
                      }

                      def keystoreFile =
                          new File(
                              project.projectDir,
                              "sohay-release.keystore"
                          )

                      signingConfig.storeFile =
                          keystoreFile

                      signingConfig.storePassword =
                          System.getenv(
                              "ANDROID_KEYSTORE_PASSWORD"
                          )

                      signingConfig.keyAlias =
                          System.getenv(
                              "ANDROID_KEY_ALIAS"
                          )

                      signingConfig.keyPassword =
                          System.getenv(
                              "ANDROID_KEY_PASSWORD"
                          )

                      android.buildTypes.release.signingConfig =
                          signingConfig

                      println("==============================================")
                      println("Sohay release signing configuration enabled")
                      println("Keystore: " +
                          keystoreFile.absolutePath)
                      println("Alias: " +
                          System.getenv("ANDROID_KEY_ALIAS"))
                      println("==============================================")
                  }
              }
          }
          EOF

          echo "Signing configuration created."

      # =========================================================
      # 15. Make Gradle executable
      # =========================================================
      - name: Make Gradle wrapper executable
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew

      # =========================================================
      # 16. Show Gradle version
      # =========================================================
      - name: Verify Gradle
        working-directory: frontend/android
        run: |
          java -version
          ./gradlew --version

      # =========================================================
      # 17. Clean
      # =========================================================
      - name: Clean Android build
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew clean \
            --init-script signing.init.gradle \
            --no-daemon

      # =========================================================
      # 18. Build signed release APK
      # =========================================================
      - name: Build signed release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew assembleRelease \
            --init-script signing.init.gradle \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 19. Locate APK
      # =========================================================
      - name: Locate release APK
        shell: bash
        run: |
          set -e

          find frontend/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not found."

            find frontend/android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # =========================================================
      # 20. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "APK signature verification successful."

      # =========================================================
      # 21. Rename to sohay-app.apk
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            release/sohay-app.apk

          ls -lh release/sohay-app.apk

      # =========================================================
      # 22. Upload APK artifact
      # =========================================================
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: sohay-app
          path: release/sohay-app.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 23. Cleanup signing material
      # =========================================================
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f frontend/android/app/sohay-release.keystore
          rm -f frontend/android/signing.init.gradle

          echo "Signing files cleaned up."
