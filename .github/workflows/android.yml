name: Build Production Android APK

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Sohay APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================================================
      # 3. Setup Node.js 22
      #
      # Current Capacitor CLI requires Node.js >= 22.
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # =========================================================
      # 4. Verify Java and Node
      # =========================================================
      - name: Verify Java and Node
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          NODE_MAJOR=$(node -p "process.versions.node.split('.')[0]")

          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "ERROR: Node.js 22 or newer is required."
            exit 1
          fi

          echo
          echo "Node.js version is compatible with Capacitor."

      # =========================================================
      # 5. Install frontend dependencies
      # =========================================================
      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -e

          npm ci

      # =========================================================
      # 6. Configure Android SDK
      #
      # We deliberately do NOT use:
      # android-actions/setup-android
      #
      # GitHub's Ubuntu runner already contains Android SDK.
      # We locate sdkmanager dynamically.
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo
            echo "ERROR: sdkmanager was not found."

            echo
            echo "Android SDK contents:"
            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # =========================================================
      # 7. Accept Android SDK licenses
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      # =========================================================
      # 8. Install Android SDK 34
      #
      # Matches the current Sohay Android project:
      # compileSdk = 34
      # targetSdk  = 34
      # buildTools = 34.0.0
      # =========================================================
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # =========================================================
      # 9. Verify Android SDK
      # =========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android 34..."

          test -f \
            "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

          echo "Android 34 OK."

          echo
          echo "Checking Build Tools 34.0.0..."

          test -f \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"

          test -f \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

          echo "Build Tools 34.0.0 OK."

      # =========================================================
      # 10. Build React/Vite frontend
      # =========================================================
      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -e

          npm run build

      # =========================================================
      # 11. Capacitor sync
      #
      # IMPORTANT:
      #
      # This generates:
      #
      # frontend/android/capacitor-cordova-android-plugins/
      #
      # including:
      #
      # cordova.variables.gradle
      #
      # This was missing in the previous build.
      # =========================================================
      - name: Sync Capacitor Android project
        working-directory: frontend
        shell: bash
        run: |
          set -e

          npx cap sync android

      # =========================================================
      # 12. Verify Capacitor generated files
      # =========================================================
      - name: Verify Capacitor Android files
        shell: bash
        run: |
          set -e

          FILE="frontend/android/capacitor-cordova-android-plugins/cordova.variables.gradle"

          echo "Checking:"
          echo "$FILE"

          if [ ! -f "$FILE" ]; then
            echo
            echo "ERROR: Capacitor did not generate:"
            echo "$FILE"

            echo
            echo "Searching capacitor generated files..."

            find frontend/android \
              -maxdepth 5 \
              -type f \
              -name "*.gradle" \
              -print | sort || true

            exit 1
          fi

          echo
          echo "Capacitor Android files are ready."

      # =========================================================
      # 13. Check Android signing secrets
      # =========================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All Android signing secrets are present."

      # =========================================================
      # 14. Decode release keystore
      # =========================================================
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p frontend/android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > frontend/android/app/sohay-release.keystore

          if [ ! -s frontend/android/app/sohay-release.keystore ]; then
            echo "ERROR: Keystore file is empty or was not created."
            exit 1
          fi

          echo "Release keystore created successfully."

      # =========================================================
      # 15. Configure release signing
      #
      # The keystore is:
      #
      # frontend/android/app/sohay-release.keystore
      #
      # Because the Gradle project directory is already:
      #
      # frontend/android/app
      #
      # we MUST use:
      #
      # sohay-release.keystore
      #
      # and NOT:
      #
      # app/sohay-release.keystore
      # =========================================================
      - name: Configure release signing
        shell: bash
        run: |
          set -e

          cat > frontend/android/signing.init.gradle <<'EOF'
          gradle.afterProject { project ->

              if (project.name == "app" &&
                  project.plugins.hasPlugin("com.android.application")) {

                  def android =
                      project.extensions.findByName("android")

                  if (android != null) {

                      def signingConfig =
                          android.signingConfigs.findByName("release")

                      if (signingConfig == null) {
                          signingConfig =
                              android.signingConfigs.create("release")
                      }

                      /*
                       * project.projectDir is:
                       *
                       * frontend/android/app
                       *
                       * Therefore the keystore is directly:
                       *
                       * frontend/android/app/sohay-release.keystore
                       */

                      def keystoreFile =
                          new File(
                              project.projectDir,
                              "sohay-release.keystore"
                          )

                      if (!keystoreFile.exists()) {
                          throw new GradleException(
                              "Release keystore not found: " +
                              keystoreFile.absolutePath
                          )
                      }

                      signingConfig.storeFile =
                          keystoreFile

                      signingConfig.storePassword =
                          System.getenv(
                              "ANDROID_KEYSTORE_PASSWORD"
                          )

                      signingConfig.keyAlias =
                          System.getenv(
                              "ANDROID_KEY_ALIAS"
                          )

                      signingConfig.keyPassword =
                          System.getenv(
                              "ANDROID_KEY_PASSWORD"
                          )

                      android.buildTypes.release.signingConfig =
                          signingConfig

                      println("==============================================")
                      println("Sohay release signing configuration enabled")
                      println(
                          "Keystore: " +
                          keystoreFile.absolutePath
                      )
                      println(
                          "Alias: " +
                          System.getenv("ANDROID_KEY_ALIAS")
                      )
                      println("==============================================")
                  }
              }
          }
          EOF

          echo "Release signing configuration created."

      # =========================================================
      # 16. Make Gradle executable
      # =========================================================
      - name: Make Gradle wrapper executable
        working-directory: frontend/android
        shell: bash
        run: |
          chmod +x ./gradlew

      # =========================================================
      # 17. Verify Gradle
      # =========================================================
      - name: Verify Gradle
        working-directory: frontend/android
        shell: bash
        run: |
          set -e

          ./gradlew --version

      # =========================================================
      # 18. Clean Android project
      # =========================================================
      - name: Clean Android project
        working-directory: frontend/android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew clean \
            --init-script signing.init.gradle \
            --no-daemon

      # =========================================================
      # 19. Build signed RELEASE APK
      # =========================================================
      - name: Build signed release APK
        working-directory: frontend/android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew assembleRelease \
            --init-script signing.init.gradle \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 20. Locate APK
      # =========================================================
      - name: Locate release APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find frontend/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: Release APK was not found."

            echo
            echo "Available APK files:"

            find frontend/android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo
          echo "Release APK:"
          echo "$APK"

      # =========================================================
      # 21. Verify APK signature
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo
          echo "APK signature verification successful."

      # =========================================================
      # 22. Prepare final APK
      # =========================================================
      - name: Prepare sohay-app.apk
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            release/sohay-app.apk

          echo "Final APK:"
          ls -lh release/sohay-app.apk

      # =========================================================
      # 23. Upload production APK
      # =========================================================
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: sohay-app
          path: release/sohay-app.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 24. Cleanup signing material
      # =========================================================
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f frontend/android/app/sohay-release.keystore
          rm -f frontend/android/signing.init.gradle

          echo "Temporary signing files removed."
