name: Build Production Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    env:
      ANDROID_DIR: frontend/android
      APK_NAME: sohay-app.apk

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # 3. Android SDK
      #
      # DO NOT use android-actions/setup-android here.
      # GitHub ubuntu runners already contain the Android SDK.
      # ------------------------------------------------------------
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version

      # ------------------------------------------------------------
      # 4. Accept Android SDK licenses non-interactively
      # ------------------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # ------------------------------------------------------------
      # 5. Install required SDK components
      #
      # Keep this limited to normal Android build components.
      # ------------------------------------------------------------
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 6. Show Android environment
      # ------------------------------------------------------------
      - name: Verify Android environment
        run: |
          java -version
          sdkmanager --version
          adb version

      # ------------------------------------------------------------
      # 7. Decode production signing keystore
      # ------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > \
            "${ANDROID_DIR}/app/sohay-release.keystore"

          chmod 600 \
            "${ANDROID_DIR}/app/sohay-release.keystore"

          test -s \
            "${ANDROID_DIR}/app/sohay-release.keystore"

          echo "Release keystore decoded successfully."

      # ------------------------------------------------------------
      # 8. Create temporary signing properties
      # ------------------------------------------------------------
      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          cat > "${ANDROID_DIR}/keystore.properties" <<EOF
          storeFile=app/sohay-release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          chmod 600 "${ANDROID_DIR}/keystore.properties"

          echo "Signing configuration created."

      # ------------------------------------------------------------
      # 9. Gradle permissions
      # ------------------------------------------------------------
      - name: Make Gradle executable
        working-directory: ${{ env.ANDROID_DIR }}
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # 10. Verify Gradle
      # ------------------------------------------------------------
      - name: Verify Gradle
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --version

      # ------------------------------------------------------------
      # 11. Clean
      # ------------------------------------------------------------
      - name: Clean Android build
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew clean

      # ------------------------------------------------------------
      # 12. Build signed release APK
      # ------------------------------------------------------------
      - name: Build signed release APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew assembleRelease --stacktrace

      # ------------------------------------------------------------
      # 13. Show generated APKs
      # ------------------------------------------------------------
      - name: Find generated APK
        run: |
          echo "APK files generated:"
          find "${ANDROID_DIR}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # 14. Prepare final APK
      # ------------------------------------------------------------
      - name: Prepare sohay-app.apk
        run: |
          APK=$(find \
            "${ANDROID_DIR}/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/${APK_NAME}"

          echo "Production APK:"
          ls -lh "release/${APK_NAME}"

      # ------------------------------------------------------------
      # 15. Verify final APK
      # ------------------------------------------------------------
      - name: Verify production APK
        run: |
          test -f "release/${APK_NAME}"
          test -s "release/${APK_NAME}"

          echo "SUCCESS"
          ls -lh "release/${APK_NAME}"

      # ------------------------------------------------------------
      # 16. Upload APK
      # ------------------------------------------------------------
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: sohay-app
          path: release/sohay-app.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 17. Cleanup secrets/signing files
      # ------------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        run: |
          rm -f \
            "${ANDROID_DIR}/app/sohay-release.keystore"

          rm -f \
            "${ANDROID_DIR}/keystore.properties"

          echo "Signing files removed."
