name: Build Production Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Signed Production APK
    runs-on: ubuntu-latest

    env:
      ANDROID_DIR: frontend/android
      APK_NAME: sohay-app.apk

    steps:

      # ------------------------------------------------------------
      # 1. Checkout source code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. Set up Java
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # 3. Set up Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 4. Install Android SDK components
      #
      # compileSdk is normally determined by the project.
      # Android SDK packages required by Capacitor/Gradle are
      # installed here.
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 5. Verify Java / Android / Gradle environment
      # ------------------------------------------------------------
      - name: Show build environment
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          java -version
          ./gradlew --version
          adb version || true

      # ------------------------------------------------------------
      # 6. Decode production signing keystore
      #
      # ANDROID_KEYSTORE_BASE64 contains the complete Base64
      # encoded .keystore file.
      # ------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > \
            "${ANDROID_DIR}/app/sohay-release.keystore"

          chmod 600 "${ANDROID_DIR}/app/sohay-release.keystore"

          test -s "${ANDROID_DIR}/app/sohay-release.keystore"

          echo "Release keystore decoded successfully."

      # ------------------------------------------------------------
      # 7. Create signing properties for Gradle
      #
      # The Android module needs to know:
      # - keystore
      # - keystore password
      # - alias
      # - key password
      #
      # This creates a temporary gradle.properties file on the
      # GitHub runner. It is NOT committed to GitHub.
      # ------------------------------------------------------------
      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is not configured."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is not configured."
            exit 1
          fi

          cat > "${ANDROID_DIR}/keystore.properties" <<EOF
          storeFile=app/sohay-release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          chmod 600 "${ANDROID_DIR}/keystore.properties"

          echo "Release signing configuration created."

      # ------------------------------------------------------------
      # 8. Make Gradle executable
      # ------------------------------------------------------------
      - name: Make Gradle executable
        working-directory: ${{ env.ANDROID_DIR }}
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # 9. Clean previous build
      # ------------------------------------------------------------
      - name: Clean Android build
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew clean

      # ------------------------------------------------------------
      # 10. Build signed RELEASE APK
      # ------------------------------------------------------------
      - name: Build signed release APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew assembleRelease --stacktrace

      # ------------------------------------------------------------
      # 11. Find generated APK
      # ------------------------------------------------------------
      - name: Locate release APK
        run: |
          echo "Generated APK files:"
          find "${ANDROID_DIR}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # 12. Rename APK to sohay-app.apk
      # ------------------------------------------------------------
      - name: Prepare production APK
        run: |
          APK=$(find "${ANDROID_DIR}/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/${APK_NAME}"

          echo "Production APK:"
          ls -lh "release/${APK_NAME}"

      # ------------------------------------------------------------
      # 13. Verify APK exists
      # ------------------------------------------------------------
      - name: Verify production APK
        run: |
          test -f "release/${APK_NAME}"
          test -s "release/${APK_NAME}"

          echo "APK successfully created:"
          ls -lh "release/${APK_NAME}"

      # ------------------------------------------------------------
      # 14. Upload APK to GitHub Actions
      # ------------------------------------------------------------
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: sohay-app
          path: release/sohay-app.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 15. Remove signing material from runner
      # ------------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        run: |
          rm -f "${ANDROID_DIR}/app/sohay-release.keystore"
          rm -f "${ANDROID_DIR}/keystore.properties"

          echo "Signing files removed from runner."
