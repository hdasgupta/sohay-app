name: Build Production Android APK

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Sohay APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ---------------------------------------------------------
      # 3. Configure Android SDK
      #
      # Do NOT use android-actions/setup-android here.
      # GitHub's Ubuntu runner already contains the Android SDK.
      # We locate sdkmanager dynamically because the installed
      # command-line-tools directory can change between runners.
      # ---------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo
            echo "Android SDK directory:"
            ls -la "$ANDROID_SDK_ROOT" || true
            echo
            echo "cmdline-tools:"
            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 4. Accept Android SDK licenses
      # ---------------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      # ---------------------------------------------------------
      # 5. Install EXACT SDK version used by Sohay
      #
      # Current repository:
      # compileSdk = 34
      # targetSdk  = 34
      # buildTools = 34.0.0
      # ---------------------------------------------------------
      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ---------------------------------------------------------
      # 6. Verify Android SDK
      # ---------------------------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Installed Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "Installed build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo
          echo "Android 34:"
          test -f "$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

          echo
          echo "Build Tools 34.0.0:"
          test -f "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"

          echo
          echo "Android SDK verification successful."

      # ---------------------------------------------------------
      # 7. Check required signing secrets
      # ---------------------------------------------------------
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is not configured."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is not configured."
            exit 1
          fi

          echo "All Android signing secrets are present."

      # ---------------------------------------------------------
      # 8. Create temporary signing keystore
      # ---------------------------------------------------------
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p frontend/android/app

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > frontend/android/app/sohay-release.keystore

          if [ ! -s frontend/android/app/sohay-release.keystore ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Release keystore created."

      # ---------------------------------------------------------
      # 9. Create temporary Gradle signing configuration
      #
      # This is intentionally generated during CI.
      # Your repository's current app/build.gradle does not
      # currently define signingConfigs.release.
      #
      # Therefore we configure the Android Gradle Plugin from
      # an init script without permanently modifying the repo.
      # ---------------------------------------------------------
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          cat > frontend/android/signing.init.gradle <<'EOF'
          gradle.afterProject { project ->

              if (project.name == "app" &&
                  project.plugins.hasPlugin("com.android.application")) {

                  def android = project.extensions.findByName("android")

                  if (android != null) {

                      def signingConfig =
                          android.signingConfigs.findByName("release")

                      if (signingConfig == null) {
                          signingConfig =
                              android.signingConfigs.create("release")
                      }

                      def keystoreFile =
                          new File(project.projectDir, "app/sohay-release.keystore")

                      signingConfig.storeFile = keystoreFile
                      signingConfig.storePassword =
                          System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      signingConfig.keyAlias =
                          System.getenv("ANDROID_KEY_ALIAS")
                      signingConfig.keyPassword =
                          System.getenv("ANDROID_KEY_PASSWORD")

                      android.buildTypes.release.signingConfig =
                          signingConfig

                      println("==============================================")
                      println("Sohay release signing configuration enabled")
                      println("Keystore: " + keystoreFile.absolutePath)
                      println("Alias: " +
                          System.getenv("ANDROID_KEY_ALIAS"))
                      println("==============================================")
                  }
              }
          }
          EOF

          echo "Temporary Gradle signing configuration created."

      # ---------------------------------------------------------
      # 10. Make Gradle executable
      # ---------------------------------------------------------
      - name: Make Gradle wrapper executable
        working-directory: frontend/android
        shell: bash
        run: |
          chmod +x ./gradlew

      # ---------------------------------------------------------
      # 11. Show Gradle / Java versions
      # ---------------------------------------------------------
      - name: Verify Java and Gradle
        working-directory: frontend/android
        shell: bash
        run: |
          java -version
          ./gradlew --version

      # ---------------------------------------------------------
      # 12. Clean previous build
      # ---------------------------------------------------------
      - name: Clean Android build
        working-directory: frontend/android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew clean \
            --init-script signing.init.gradle \
            --no-daemon

      # ---------------------------------------------------------
      # 13. Build signed RELEASE APK
      # ---------------------------------------------------------
      - name: Build signed release APK
        working-directory: frontend/android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew assembleRelease \
            --init-script signing.init.gradle \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 14. Find generated APK
      # ---------------------------------------------------------
      - name: Locate release APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find frontend/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: Expected release APK was not found."
            echo
            echo "Available APK files:"
            find frontend/android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print || true
            exit 1
          fi

          echo
          echo "Release APK found:"
          echo "$APK"

      # ---------------------------------------------------------
      # 15. Verify APK is signed
      # ---------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo
          echo "APK signature verification successful."

      # ---------------------------------------------------------
      # 16. Create final APK
      # ---------------------------------------------------------
      - name: Prepare Sohay APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            frontend/android/app/build/outputs/apk/release/app-release.apk \
            release/sohay-app.apk

          ls -lh release/sohay-app.apk

      # ---------------------------------------------------------
      # 17. Upload production APK
      # ---------------------------------------------------------
      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: sohay-app
          path: release/sohay-app.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 18. Cleanup signing material
      # ---------------------------------------------------------
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f frontend/android/app/sohay-release.keystore
          rm -f frontend/android/signing.init.gradle

          echo "Signing files cleaned up."
