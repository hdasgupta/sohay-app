# Render blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wbfmh-appointment-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "5000"
      - key: APP_TIMEZONE
        value: Asia/Kolkata

      # Frontend & CORS
      - key: FRONTEND_URL
        value: https://sohay-app.himaghna-dasgupta.workers.dev
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,https://sohay-app.himaghna-dasgupta.workers.dev
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "true"

      # Database
      - key: DATABASE_URL
        value: postgresql://postgres:Executable#1@localhost:5432/postgres
      - key: DB_SSL
        value: "false"
      - key: DB_POOL_MAX
        value: "10"

      # Auth & Security
      - key: JWT_SECRET
        value: dev_3f9c1b7e2a8d4c6f9e0b1a2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f6
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: OTP_SECRET
        value: dev_otp_8e7d6c5b4a39281706f5e4d3c2b1a0f9
      - key: CAPTCHA_SECRET
        value: dev_captcha_1a2b3c4d5e6f708192a3b4c5d6e7f809
      - key: OTP_VALIDITY_MINUTES
        value: "10"
      - key: CAPTCHA_VALIDITY_MINUTES
        value: "5"

      # Seed Admin
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        value: wbffmh@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin@12345

      # Email Service (Resend)
      - key: EMAIL_FROM
        value: West Bengal Forum for Mental Health <onboarding@resend.dev>
      - key: EMAIL_PROVIDER
        value: resend

      # Neon S3 Storage
      - key: STORAGE_PROVIDER
        value: s3
      - key: AWS_ENDPOINT_URL_S3
